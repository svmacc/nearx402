# Publishes dashboard/ as a GitHub Pages site. The page is static: it reads the
# policy contract through public RPC and holds no key. Turn Pages on once in
# the repository settings (Settings > Pages > Source: GitHub Actions); until
# then this workflow fails at the deploy step and nothing is published.
name: dashboard-pages

on:
  push:
    branches: [main]
    paths: [dashboard/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
